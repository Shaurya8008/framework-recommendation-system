version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: frameworkfit-db
    environment:
      POSTGRES_DB: frameworkfit
      POSTGRES_USER: frameworkfit
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameworkfit -d frameworkfit"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frameworkfit-api
    environment:
      DATABASE_URL: postgresql://frameworkfit:secretpassword@db:5432/frameworkfit
      MLFLOW_TRACKING_URI: sqlite:///mlruns.db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns.db:/app/mlruns.db

volumes:
  pgdata:
