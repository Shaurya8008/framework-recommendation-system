services:
  # 1. FastAPI Backend (ML & API Layer)
  - type: web
    name: frameworkfit-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frameworkfit-db
          property: connectionString

  # 2. Vite/React SSR Frontend (TanStack Start)
  - type: web
    name: frameworkfit-frontend
    env: node
    plan: free
    buildCommand: "cd 'Framework Navigator (1)' && npm install && BUILD_TARGET=render npm run build"
    startCommand: "cd 'Framework Navigator (1)' && node .output/server/index.mjs"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_RECOMMEND_API
        fromService:
          type: web
          name: frameworkfit-backend
          property: url

databases:
  - name: frameworkfit-db
    plan: free
